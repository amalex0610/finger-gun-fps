<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber Finger-Gun AR | 實景手勢槍戰 FPS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      color: #fff;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #webcam {
      display: none;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 槍口火光閃光層 */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,230,150,0.6) 0%, rgba(255,100,0,0.25) 60%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s ease-out;
      z-index: 10;
    }

    /* 受傷紅屏覆蓋層 */
    #damage-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 0, 50, 0.1) 40%, rgba(255, 0, 0, 0.65) 100%);
      box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease-out;
      z-index: 11;
    }

    /* HUD 介面層 */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 20;
    }

    .top-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 16px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15);
    }

    .top-bar-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar-row2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .score-box {
      font-size: 18px;
      font-weight: 800;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .score-value {
      color: #ffdd00;
      font-size: 24px;
      margin-left: 6px;
      text-shadow: 0 0 10px rgba(255, 221, 0, 0.8);
    }

    .combo-badge {
      display: inline-block;
      margin-left: 10px;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 900;
      transform: scale(0);
      transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .combo-badge.active {
      transform: scale(1);
    }

    /* 玩家血條 */
    .hp-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .hp-label {
      font-size: 13px;
      font-weight: 900;
      color: #ff3366;
      letter-spacing: 0.5px;
    }

    .hp-bar-bg {
      flex: 1;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 50, 100, 0.4);
    }

    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
      border-radius: 6px;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    .hp-value-text {
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      min-width: 45px;
      text-align: right;
    }

    /* 武器徽章 */
    .weapon-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);

    .weapon-badge.shotgun {

    .hud-controls {

      gap: 8px;
    }

    .hud-btn {
      background: rgba(20, 30, 50, 0.85);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .hud-btn:active {
      background: #00f0ff;
      color: #000;
    }

    /* 手勢狀態指示條 */
    .status-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 8px #ff4444;
    }
    .status-dot.ready {
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }

    /* 初始開始視窗 & Game Over 視窗 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 18, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .modal-title {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .modal-desc {
      font-size: 14px;
      color: #c0c6d8;
      max-width: 360px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .gesture-guide {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 13px;
      line-height: 1.8;
      color: #9ef0ff;
    }

    .action-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #000;
      border: none;
      padding: 14px 38px;
      border-radius: 35px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .action-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .game-over-stats {
      font-size: 20px;
      color: #ffdd00;
      margin: 16px 0 24px 0;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(255, 221, 0, 0.6);
    }
  </style>

<script>
// ==========================================
// 1. Web Audio API：極致戰鬥音效與程式化賽博 BGM
// ==========================================
class SoundSynthesizer {
  constructor() {
    this.ctx = null;
    this.bgmPlaying = false;
    this.bgmTimer = null;
    this.step = 0;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // 手槍射擊音 (Pistol)
  playLaserPistol() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);

    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);

    // 衝擊白噪聲
    this.playNoisePunch(0.08, 0.35);
  }

  // 雙管霰彈槍射擊音 (Shotgun - 重低音擴散爆裂)
  playShotgun() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;

    // 雙振盪器重擊
    for (let f of [320, 160]) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.28);

      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    // 重噪聲破鳴
    this.playNoisePunch(0.2, 0.7);
  }

  playNoisePunch(duration, volume) {
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1400, this.ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + duration);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start();
  }

  // 命中叮聲
  playHitSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.setValueAtTime(1900, now + 0.04);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }

  // 敵人擊毀爆炸
  playExplosion() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * 0.35;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.08));
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(500, now);
    filter.frequency.exponentialRampToValueAtTime(60, now + 0.32);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.75, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }

  // 玩家受傷被撞擊音效
  playHurtSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.25);
    gain.gain.setValueAtTime(0.65, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.28);
    this.playNoisePunch(0.18, 0.6);
  }

  // 自爆無人機逼近警報滴答音
  playAlertBeep() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(950, now);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.06);
  }

  // --- 程式化賽博電子 BGM (124 BPM Cyber Synthwave) ---
  startBgm() {
    if (this.bgmPlaying || !this.ctx) return;
    this.bgmPlaying = true;
    this.step = 0;
    const stepInterval = (60 / 124) / 4; // 16 分音符

    const bassNotes = [55, 55, 55, 55, 65.4, 65.4, 55, 55, 49, 49, 49, 49, 58.2, 58.2, 65.4, 65.4];
    const leadNotes = [220, 0, 261.6, 0, 293.6, 0, 329.6, 0, 392, 0, 329.6, 0, 293.6, 0, 261.6, 0];

    this.bgmTimer = setInterval(() => {
      if (!this.bgmPlaying || !this.ctx) return;
      const now = this.ctx.currentTime;
      const s = this.step % 16;

      // 4/4 拍重音底鼓 (Kick on 0, 4, 8, 12)
      if (s % 4 === 0) {
        const kickOsc = this.ctx.createOscillator();
        const kickGain = this.ctx.createGain();
        kickOsc.frequency.setValueAtTime(120, now);
        kickOsc.frequency.exponentialRampToValueAtTime(35, now + 0.08);
        kickGain.gain.setValueAtTime(0.25, now);
        kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        kickOsc.connect(kickGain);
        kickGain.connect(this.ctx.destination);
        kickOsc.start(now);
        kickOsc.stop(now + 0.09);
      }

      // 踩鑔 (Hi-hat on 2, 6, 10, 14)
      if (s % 2 === 1) {
        const hhBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.03, this.ctx.sampleRate);
        const d = hhBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const hh = this.ctx.createBufferSource();
        hh.buffer = hhBuf;
        const hhFilter = this.ctx.createBiquadFilter();
        hhFilter.type = 'highpass';
        hhFilter.frequency.setValueAtTime(7000, now);
        const hhGain = this.ctx.createGain();
        hhGain.gain.setValueAtTime(0.06, now);
        hhGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        hh.connect(hhFilter);
        hhFilter.connect(hhGain);
        hhGain.connect(this.ctx.destination);
        hh.start(now);
      }

      // 律動合成 Bassline
      const bassFreq = bassNotes[s];
      if (bassFreq > 0) {
        const bOsc = this.ctx.createOscillator();
        const bGain = this.ctx.createGain();
        bOsc.type = 'sawtooth';
        bOsc.frequency.setValueAtTime(bassFreq, now);
        const bFilter = this.ctx.createBiquadFilter();
        bFilter.type = 'lowpass';
        bFilter.frequency.setValueAtTime(320, now);

        bGain.gain.setValueAtTime(0.08, now);
        bGain.gain.exponentialRampToValueAtTime(0.001, now + stepInterval * 1.5);

        bOsc.connect(bFilter);
        bFilter.connect(bGain);
        bGain.connect(this.ctx.destination);
        bOsc.start(now);
        bOsc.stop(now + stepInterval * 1.5);
      }

      // 賽博琶音旋律 (Arpeggio)
      const leadFreq = leadNotes[s];
      if (leadFreq > 0) {
        const lOsc = this.ctx.createOscillator();
        const lGain = this.ctx.createGain();
        lOsc.type = 'sine';
        lOsc.frequency.setValueAtTime(leadFreq, now);
        lGain.gain.setValueAtTime(0.04, now);
        lGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        lOsc.connect(lGain);
        lGain.connect(this.ctx.destination);
        lOsc.start(now);
        lOsc.stop(now + 0.12);
      }

      this.step++;
    }, stepInterval * 1000);
  }

  stopBgm() {
    this.bgmPlaying = false;
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }

  toggleBgm() {
    if (this.bgmPlaying) {
      this.stopBgm();
      return false;
    } else {
      this.startBgm();
      return true;
    }
  }
}

const sfx = new SoundSynthesizer();

// ==========================================
// 2. 遊戲狀態機與核心變數
// ==========================================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const videoElement = document.getElementById('webcam');
const flashOverlay = document.getElementById('flash-overlay');
const damageOverlay = document.getElementById('damage-overlay');
const scoreElem = document.getElementById('score');
const comboElem = document.getElementById('combo');
const hpBarFill = document.getElementById('hp-bar-fill');
const hpText = document.getElementById('hp-text');
const weaponBadge = document.getElementById('weapon-badge');
const weaponIcon = document.getElementById('weapon-icon');
const weaponName = document.getElementById('weapon-name');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const bgmToggleBtn = document.getElementById('bgm-toggle-btn');
const gameOverModal = document.getElementById('game-over-modal');
const gameOverStats = document.getElementById('game-over-stats');

let currentFacingMode = 'environment';
let cameraInstance = null;

// 玩家屬性
let maxHp = 100;
let currentHp = 100;
let score = 0;
let combo = 0;
let lastHitTime = 0;

// 當前武器狀態：'PISTOL' (手槍) 或 'SHOTGUN' (雙管霰彈槍)
let currentWeapon = 'PISTOL';

// 手勢狀態
let isGunDetected = false;
let isThumbReady = false;
let lastFireTime = 0;

let muzzlePos = { x: -100, y: -100 };
let currentHandLandmarks = null;
let prevThumbDist = 0.5;

// 特效實體池
let particles = [];
let floatingTexts = [];

let screenShake = 0;

let enemies = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// 3. 敵人類別：普通巡航無人機 & 自爆衝鋒無人機
// ==========================================
class NormalDrone {
  constructor() {
    this.type = 'NORMAL';
    this.radius = 32 + Math.random() * 12;
    this.x = Math.random() < 0.5 ? -40 : canvas.width + 40;
    this.y = 80 + Math.random() * (canvas.height * 0.45);
    this.targetX = canvas.width * 0.15 + Math.random() * (canvas.width * 0.7);
    this.targetY = canvas.height * 0.15 + Math.random() * (canvas.height * 0.4);
    this.hp = 1;
    this.angle = 0;
    this.hoverOffset = Math.random() * Math.PI * 2;
  }

  update(dt) {
    this.x += (this.targetX - this.x) * 0.04;
    this.y += (this.targetY - this.y) * 0.04;
    this.angle += 0.03;
  }

  draw(ctx) {
    const hoverY = this.y + Math.sin(Date.now() * 0.005 + this.hoverOffset) * 8;
    ctx.save();
    ctx.translate(this.x, hoverY);

    // 外環
    ctx.rotate(this.angle);
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // 核心
    ctx.rotate(-this.angle * 2);
    ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '900 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DRONE', 0, -this.radius - 6);
    ctx.restore();
  }
}

// ⚠️ 自爆無人機 (Kamikaze Drone)
class KamikazeDrone {
  constructor() {
    this.type = 'KAMIKAZE';
    this.radius = 28;
    this.x = canvas.width * 0.2 + Math.random() * (canvas.width * 0.6);
    this.y = -60;
    // 鎖定玩家鏡頭中心
    this.targetX = canvas.width * 0.5 + (Math.random() - 0.5) * 120;
    this.targetY = canvas.height * 0.55;
    this.speed = 2.8 + Math.random() * 2.0;
    this.hp = 2; // 稍微耐打一點點
    this.angle = 0;
    this.beepTimer = 0;
    this.scale = 0.6; // 從遠處看起來小，靠近時放大
  }

  update(dt) {
    this.angle += 0.12; // 快速自旋

    // 沿直線加速撲向玩家螢幕
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    this.x += (dx / dist) * this.speed * 2.2;
    this.y += (dy / dist) * this.speed * 2.2;
    this.speed += 0.05; // 持續加速！
    this.scale = Math.min(2.4, this.scale + 0.015); // 視覺衝刺放大

    // 接近時發出急促嗶嗶聲
    this.beepTimer += dt;
    if (this.beepTimer > 0.35) {
      this.beepTimer = 0;
      sfx.playAlertBeep();
    }

    // 撞擊玩家判定 (到達屏幕中央附近)
    if (dist < 35 || this.y > canvas.height * 0.65) {
      this.detonateOnPlayer();
      return true; // 標記已移除
    }
    return false;
  }

  detonateOnPlayer() {
    // 玩家扣 20 血
    applyDamage(20);
    spawnExplosion(this.x, this.y, '#ff0033');
    sfx.playHurtSound();
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);

    // 尖銳危險旋轉刺
    ctx.rotate(this.angle);
    ctx.fillStyle = '#ff0033';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 18;

    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(-10, -10);
      ctx.lineTo(0, -this.radius - 8);
      ctx.lineTo(10, -10);
      ctx.closePath();
      ctx.fill();
    }

    // 核心警示光球 (閃爍)
    const flash = Math.sin(Date.now() * 0.02) > 0 ? '#ffea00' : '#ff0000';
    ctx.fillStyle = flash;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffea00';
    ctx.font = '900 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚠️ KAMIKAZE', 0, -this.radius - 12);
    ctx.restore();
  }
}

// 扣血邏輯
function applyDamage(amount) {
  if (isGameOver) return;
  currentHp = Math.max(0, currentHp - amount);
  updateHpUI();

  // 螢幕泛紅與受傷震動
  damageOverlay.style.opacity = '1';
  screenShake = 22;
  setTimeout(() => { damageOverlay.style.opacity = '0'; }, 180);

  if (navigator.vibrate) {
    navigator.vibrate([80, 50, 100]);
  }

  if (currentHp <= 0) {
    triggerGameOver();
  }
}

function updateHpUI() {
  const pct = Math.max(0, (currentHp / maxHp) * 100);
  hpBarFill.style.width = pct + '%';
  hpText.innerText = `${currentHp}/${maxHp}`;

  if (pct < 30) {
    hpBarFill.style.background = '#ff0033';
  } else if (pct < 60) {
    hpBarFill.style.background = '#ffaa00';
  } else {
    hpBarFill.style.background = 'linear-gradient(90deg, #ff0055, #00ff88)';
  }
}

function triggerGameOver() {
  isGameOver = true;
  sfx.stopBgm();
  gameOverStats.innerText = `FINAL SCORE: ${score} · COMBO: ${combo}`;
  gameOverModal.style.display = 'flex';
}

function restartGame() {
  currentHp = maxHp;
  score = 0;
  combo = 0;
  enemies = [];
  particles = [];
  laserBeams = [];
  isGameOver = false;
  scoreElem.innerText = score;
  updateHpUI();
  gameOverModal.style.display = 'none';
  sfx.startBgm();
}

// 粒子與浮動文字
function spawnExplosion(x, y, color = '#ff0055') {
  for (let i = 0; i < 28; i++) {
    const speed = 3 + Math.random() * 8;
    const ang = Math.random() * Math.PI * 2;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed - 2,
      size: 4 + Math.random() * 6,
      color: color,
      alpha: 1,
      decay: 0.02 + Math.random() * 0.02,
      gravity: 0.15
    });
  }
}

function spawnFloatingText(text, x, y, color = '#ffdd00') {
  floatingTexts.push({ text, x, y, alpha: 1, vy: -2.5, color });
}

// ==========================================
// 4. 射擊系統：手槍單發 VS 雙指霰彈 5 連發
// ==========================================
function executeFire(originX, originY, targetX, targetY) {
  const now = Date.now();
  const isShotgun = currentWeapon === 'SHOTGUN';
  const cooldown = isShotgun ? 320 : 180;

  if (now - lastFireTime < cooldown) return;
  lastFireTime = now;

  // 1. 音效與震動
  if (isShotgun) {
    sfx.playShotgun();
    screenShake = 18;
    flashOverlay.style.opacity = '1';
    setTimeout(() => { flashOverlay.style.opacity = '0'; }, 80);
    if (navigator.vibrate) navigator.vibrate([60]);
  } else {
    sfx.playLaserPistol();
    screenShake = 10;
    flashOverlay.style.opacity = '0.85';
    setTimeout(() => { flashOverlay.style.opacity = '0'; }, 50);
    if (navigator.vibrate) navigator.vibrate([30]);
  }

  // 2. 構建射擊彈道 (手槍 1 發，霰彈槍 5 發擴散彈)
  const pellets = [];
  if (isShotgun) {
    const baseAngle = Math.atan2(targetY - originY, targetX - originX);
    const spreadAngles = [-0.22, -0.11, 0, 0.11, 0.22]; // 扇形擴散
    const len = Math.hypot(targetX - originX, targetY - originY) || 300;

    for (let offset of spreadAngles) {
      const ang = baseAngle + offset;
      pellets.push({
        tx: originX + Math.cos(ang) * len,
        ty: originY + Math.sin(ang) * len,
        color: '#ff9900'
      });
    }
  } else {
    pellets.push({ tx: targetX, ty: targetY, color: '#00f0ff' });
  }

  // 3. 繪製雷射並執行碰撞判定
  for (let p of pellets) {
    laserBeams.push({
      x1: originX, y1: originY,
      x2: p.tx, y2: p.ty,
      color: p.color,
      alpha: 1
    });

    // 命中檢測
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dist = Math.hypot(p.tx - e.x, p.ty - e.y);
      if (dist < e.radius + 24) {
        e.hp -= 1;
        sfx.playHitSound();

        if (e.hp <= 0) {
          sfx.playExplosion();
          spawnExplosion(e.x, e.y, e.type === 'KAMIKAZE' ? '#ff3300' : '#00ffff');

          // 計分與連擊
          if (now - lastHitTime < 2500) combo++;
          else combo = 1;
          lastHitTime = now;

          const basePoints = e.type === 'KAMIKAZE' ? 250 : 100;
          const points = basePoints * combo;
          score += points;
          scoreElem.innerText = score;

          if (combo > 1) {
            comboElem.innerText = `${combo}x COMBO!`;
            comboElem.classList.add('active');
          }

          spawnFloatingText(`+${points}`, e.x, e.y, e.type === 'KAMIKAZE' ? '#ffaa00' : '#00ff88');
          enemies.splice(i, 1);
        }
        break; // 該顆彈丸已被消耗
      }
    }
  }
}

// 點擊螢幕備用開火
window.addEventListener('pointerdown', (e) => {
  if (isGameOver) return;
  sfx.init();
  const startX = muzzlePos.x > 0 ? muzzlePos.x : canvas.width * 0.5;
  const startY = muzzlePos.y > 0 ? muzzlePos.y : canvas.height;
  executeFire(startX, startY, e.clientX, e.clientY);
});

// ==========================================
// 5. MediaPipe 手勢辨識 (雙武器模式切換)
// ==========================================
function onResults(results) {
  if (isGameOver) return;

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    isGunDetected = false;
    gunCrosshair.active = false;
    currentHandLandmarks = null;
    statusDot.className = 'status-dot';
    statusText.innerText = '尋找手部中... 請將手伸入鏡頭 👉';
    return;
  }

  const landmarks = results.multiHandLandmarks[0];

  // 畫布座標轉換
  const pts = landmarks.map(p => ({
    x: (currentFacingMode === 'user' ? (1 - p.x) : p.x) * canvas.width,
    y: p.y * canvas.height,
    z: p.z
  }));
  currentHandLandmarks = pts;

  const dist = (i, j) => Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
  const palmSize = dist(0, 5) || 100;
  if (palmSize < 25) return;

  // 1. 食指伸展判定 (Index)
  const isIndexStraight = dist(8, 5) > dist(6, 5) * 1.5;

  // 2. 中指伸展判定 (Middle) -> 判定是手槍還是霰彈槍！
  const isMiddleStraight = dist(12, 9) > dist(10, 9) * 1.45 && dist(12, 0) > dist(8, 0) * 0.8;

  // 判斷武器模式
  if (isIndexStraight && isMiddleStraight) {
    // 💥 雙指伸展 -> SHOTGUN 雙管霰彈槍
    currentWeapon = 'SHOTGUN';
    weaponBadge.className = 'weapon-badge shotgun';
    weaponIcon.innerText = '💥';
    weaponName.innerText = 'SHOTGUN (雙指)';
  } else if (isIndexStraight) {
    // 🔫 單指伸展 -> PISTOL 手槍
    currentWeapon = 'PISTOL';
    weaponBadge.className = 'weapon-badge';
    weaponIcon.innerText = '🔫';
    weaponName.innerText = 'PISTOL (單指)';
  }

  const isGunPose = isIndexStraight;

  if (isGunPose) {
    isGunDetected = true;
    gunCrosshair.active = true;

    // 槍口位置取食指尖 (8)
    muzzlePos = { x: pts[8].x, y: pts[8].y };

    // 準星朝指尖前方延伸
    const dirX = pts[8].x - pts[6].x;
    const dirY = pts[8].y - pts[6].y;
    const dirLen = Math.hypot(dirX, dirY) || 1;

    gunCrosshair.targetX = pts[8].x + (dirX / dirLen) * 140;
    gunCrosshair.targetY = pts[8].y + (dirY / dirLen) * 140;

    // 3. 扣扳機射擊判定 (大拇指尖 4 相對食指根部 5)
    const thumbDist = dist(4, 5) / palmSize;
    const thumbSpeed = prevThumbDist - thumbDist;
    prevThumbDist = thumbDist;

    const now = Date.now();

    if (thumbDist > 0.45) {
      isThumbReady = true;
      statusDot.className = 'status-dot ready';
      statusText.innerText = currentWeapon === 'SHOTGUN' 
        ? '💥 霰彈就緒！扣動拇指 5 連發覆蓋！' 
        : '🎯 鎖定瞄準！向下扣動大拇指開火！';
    } else if (isThumbReady && (thumbDist < 0.38 || thumbSpeed > 0.08)) {
      isThumbReady = false;
      statusDot.className = 'status-dot';
      statusText.innerText = '💥 FIRE!! 開火！';
      executeFire(muzzlePos.x, muzzlePos.y, gunCrosshair.x, gunCrosshair.y);
    }
  } else {
    isGunDetected = false;
    gunCrosshair.active = false;
    statusDot.className = 'status-dot';
    statusText.innerText = '請比出手指槍：單指 👉 手槍 / 雙指 ✌️ 霰彈';
  }
}

// ==========================================
// 6. 主遊戲循環 (繪圖與邏輯更新)
// ==========================================
let lastTime = performance.now();
function gameLoop() {
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  if (!isGameOver) {
    // 連擊冷卻計時
    if (combo > 0 && Date.now() - lastHitTime > 3000) {
      combo = 0;
      comboElem.classList.remove('active');
    }

    // 敵人動態生成：70% 機率普通怪，30% 機率自爆怪
    if (enemies.length < 4 && Date.now() > nextSpawnTime) {
      if (Math.random() < 0.35) {
        enemies.push(new KamikazeDrone());
      } else {
        enemies.push(new NormalDrone());
      }
      nextSpawnTime = Date.now() + 1600 + Math.random() * 1200;
    }

    // 更新敵人
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const shouldRemove = e.update(dt);
      if (shouldRemove) {
        enemies.splice(i, 1);
      }
    }
  }

  // 螢幕震動計算
  ctx.save();
  if (screenShake > 0) {
    const rx = (Math.random() - 0.5) * screenShake;
    const ry = (Math.random() - 0.5) * screenShake;
    ctx.translate(rx, ry);
    screenShake *= 0.85;
    if (screenShake < 0.5) screenShake = 0;
  }

  // 1. 繪製相機畫面
  if (videoElement.readyState >= 2) {
    ctx.save();
    if (currentFacingMode === 'user') {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    // 暗角漸變
    const vignette = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, canvas.width * 0.3,
      canvas.width / 2, canvas.height / 2, canvas.width * 0.75
    );
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(5, 10, 25, 0.55)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#0a0d1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 2. 繪製所有敵人
  for (let e of enemies) {
    e.draw(ctx);
  }

  // 3. 繪製雷射光束
  for (let i = laserBeams.length - 1; i >= 0; i--) {
    const beam = laserBeams[i];
    ctx.save();
    ctx.strokeStyle = beam.color || '#00f0ff';
    ctx.lineWidth = currentWeapon === 'SHOTGUN' ? 6 : 4;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(beam.x1, beam.y1);
    ctx.lineTo(beam.x2, beam.y2);
    ctx.stroke();
    ctx.restore();

    beam.alpha -= 0.12;
    if (beam.alpha <= 0) laserBeams.splice(i, 1);
  }

  // 4. 繪製粒子碎片
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.alpha -= p.decay;

    ctx.save();
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (p.alpha <= 0) particles.splice(i, 1);
  }

  // 5. 繪製浮動文字
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.025;

    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.fillStyle = ft.color;
    ctx.font = '900 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = ft.color;
    ctx.shadowBlur = 10;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();

    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }

  // 6. 繪製霓虹手部骨架
  if (currentHandLandmarks) {
    const pts = currentHandLandmarks;
    ctx.save();
    ctx.strokeStyle = currentWeapon === 'SHOTGUN' ? 'rgba(255, 120, 0, 0.45)' : 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 2;
    const connections = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]
    ];
    for (const [a, b] of connections) {
      ctx.beginPath();
      ctx.moveTo(pts[a].x, pts[a].y);
      ctx.lineTo(pts[b].x, pts[b].y);
      ctx.stroke();
    }

    // 關節光點
    ctx.fillStyle = currentWeapon === 'SHOTGUN' ? '#ffaa00' : '#00f0ff';
    ctx.beginPath();
    ctx.arc(pts[8].x, pts[8].y, 6, 0, Math.PI * 2);
    if (currentWeapon === 'SHOTGUN') {
      ctx.arc(pts[12].x, pts[12].y, 6, 0, Math.PI * 2);
    }
    ctx.fill();

    // 拇指 (扳機)
    ctx.fillStyle = isThumbReady ? '#00ff88' : '#ff4444';
    ctx.beginPath();
    ctx.arc(pts[4].x, pts[4].y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 7. 繪製準星 (手槍單環 / 霰彈槍雙環)
  if (gunCrosshair.active) {
    if (gunCrosshair.x === -100) {
      gunCrosshair.x = gunCrosshair.targetX;
      gunCrosshair.y = gunCrosshair.targetY;
    } else {
      gunCrosshair.x += (gunCrosshair.targetX - gunCrosshair.x) * 0.45;
      gunCrosshair.y += (gunCrosshair.targetY - gunCrosshair.y) * 0.45;
    }

    const cx = gunCrosshair.x;
    const cy = gunCrosshair.y;
    ctx.save();
    ctx.translate(cx, cy);

    const themeColor = currentWeapon === 'SHOTGUN' 
      ? (isThumbReady ? '#ffaa00' : '#ff5500') 
      : (isThumbReady ? '#00ff88' : '#00f0ff');

    ctx.strokeStyle = themeColor;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = themeColor;
    ctx.shadowBlur = 12;

    // 準星圓環
    ctx.beginPath();
    ctx.arc(0, 0, currentWeapon === 'SHOTGUN' ? 32 : 24, 0, Math.PI * 2);
    ctx.stroke();

    if (currentWeapon === 'SHOTGUN') {
      // 霰彈槍專屬擴散標記點
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = themeColor;
        ctx.beginPath();
        ctx.arc(0, 32, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 十字瞄準線
    ctx.beginPath();
    ctx.moveTo(-35, 0); ctx.lineTo(-14, 0);
    ctx.moveTo(14, 0); ctx.lineTo(35, 0);
    ctx.moveTo(0, -35); ctx.lineTo(0, -14);
    ctx.moveTo(0, 14); ctx.lineTo(0, 35);
    ctx.stroke();

    // 狀態提示文字
    ctx.shadowBlur = 0;
    ctx.fillStyle = themeColor;
    ctx.font = '900 11px sans-serif';
    ctx.textAlign = 'center';
    const statusLabel = isThumbReady 
      ? (currentWeapon === 'SHOTGUN' ? '💥 SHOTGUN READY' : '⚡ PISTOL READY') 
      : 'AIMING...';
    ctx.fillText(statusLabel, 0, currentWeapon === 'SHOTGUN' ? 48 : 40);

    ctx.restore();
  }

  ctx.restore();

  requestAnimationFrame(gameLoop);
}

// ==========================================
// 7. 初始化 MediaPipe Hands & 攝影機控制
// ==========================================
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 0,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
hands.onResults(onResults);

function startCamera(facingMode = 'environment') {
  currentFacingMode = facingMode;
  if (cameraInstance) {
    cameraInstance.stop();
  }

  cameraInstance = new Camera(videoElement, {
    onFrame: async () => {
      await hands.send({ image: videoElement });
    },
    width: { ideal: 640 },
    height: { ideal: 480 },
    facingMode: facingMode
  });
  cameraInstance.start();
}

// 事件監聽
document.getElementById('camera-flip-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  startCamera(currentFacingMode);
});

bgmToggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOn = sfx.toggleBgm();
  bgmToggleBtn.innerText = isOn ? '🎵 BGM: ON' : '🔇 BGM: OFF';
});

document.getElementById('start-btn').addEventListener('click', () => {
  sfx.init();
  sfx.startBgm();
  document.getElementById('start-modal').style.display = 'none';
  startCamera(currentFacingMode);
  requestAnimationFrame(gameLoop);
});

document.getElementById('restart-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  restartGame();
});
</script>
