<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber Finger-Gun AR 3.0 | 肉鴿晶片射擊</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      color: #fff;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #webcam {
      display: none;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 槍口火光閃光層 */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,230,150,0.6) 0%, rgba(255,100,0,0.25) 60%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s ease-out;
      z-index: 10;
    }

    /* 受傷紅屏覆蓋層 */
    #damage-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255, 0, 50, 0.1) 40%, rgba(255, 0, 0, 0.65) 100%);
      box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease-out;
      z-index: 11;
    }

    /* 子彈時間時空扭曲覆蓋層 */
    #bullet-time-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 30%, rgba(0, 150, 255, 0.25) 100%);
      box-shadow: inset 0 0 45px rgba(0, 240, 255, 0.4);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease-out;
      z-index: 9;
    }

    /* 極簡通透懸浮 HUD (完全不遮擋頂部戰場) */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px;
      z-index: 20;
    }

    /* 頂部懸浮列：左側血量與分數，右側微型功能按鈕 */
    .top-floating-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    /* 左側極簡卡片 (半透明微型條) */
    .left-status-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .hp-and-score-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(8, 12, 22, 0.6);
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    .hp-bar-bg {
      width: 65px;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #00ff88);
      border-radius: 4px;
      transition: width 0.2s ease-out;
    }

    .score-display {
      font-size: 14px;
      font-weight: 900;
      color: #ffdd00;
      text-shadow: 0 0 8px rgba(255, 221, 0, 0.8);
      letter-spacing: 0.5px;
    }

    .combo-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #fff;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 900;
      transform: scale(0);
      transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .combo-badge.active {
      transform: scale(1);
    }

    /* 已裝備肉鴿晶片微型徽章 */
    .perks-inventory {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .perk-pill {
      background: rgba(0, 240, 255, 0.2);
      border: 1px solid rgba(0, 240, 255, 0.5);
      color: #00f0ff;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      backdrop-filter: blur(4px);
    }

    /* 右側微型圖示按鈕 */
    .right-btn-group {
      pointer-events: auto;
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(10, 15, 30, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.15s;
    }
    .icon-btn:active {
      background: #00f0ff;
      color: #000;
      transform: scale(0.9);
    }

    /* 底部手勢狀態提示 */
    .status-panel {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 6px #ff4444;
    }
    .status-dot.ready {
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
    }

    /* 初始開始視窗 & Game Over 視窗 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 18, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .modal-title {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .modal-desc {
      font-size: 14px;
      color: #c0c6d8;
      max-width: 360px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .gesture-guide {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 13px;
      line-height: 1.8;
      color: #9ef0ff;
    }

    .action-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      color: #000;
      border: none;
      padding: 14px 38px;
      border-radius: 35px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .action-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .game-over-stats {
      font-size: 20px;
      color: #ffdd00;
      margin: 16px 0 24px 0;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(255, 221, 0, 0.6);
    }
  </style>

  <!-- 引入 Google MediaPipe Hands 核心庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="app-container">
  <video id="webcam" playsinline></video>
  <canvas id="game-canvas"></canvas>
  <div id="flash-overlay"></div>
  <div id="damage-overlay"></div>
  <div id="bullet-time-overlay"></div>

  <!-- 極簡全通透 HUD 資訊列 -->
  <div id="hud">
    <div class="top-floating-bar">
      <!-- 左上方：微型血條與分數 -->
      <div class="left-status-group">
        <div class="hp-and-score-row">
          <div class="hp-bar-bg">
            <div id="hp-bar-fill" class="hp-bar-fill"></div>
          </div>
          <span id="score" class="score-display">0</span>
          <span id="combo" class="combo-badge">3x</span>
        </div>
        <!-- 已裝備肉鴿晶片清單 -->
        <div id="perks-inventory" class="perks-inventory"></div>
      </div>

      <!-- 右上方：極簡圖示按鈕 -->
      <div class="right-btn-group">
        <button id="bgm-toggle-btn" class="icon-btn" title="切換 BGM">🎵</button>
        <button id="camera-flip-btn" class="icon-btn" title="切換鏡頭">📷</button>
      </div>
    </div>

    <!-- 底部手勢狀態提示 -->
    <div class="status-panel">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">請將手伸入鏡頭 比出手槍姿勢 👉</span>
    </div>
  </div>

  <!-- 初始開始視窗 -->
  <div id="start-modal" class="modal-overlay">
    <div class="modal-title">CYBER FINGER GUN 3.0</div>
    <div class="modal-desc">
      極簡實景 FPS × 肉鴿戰鬥晶片！<br>
      擊破敵人會掉落懸浮晶片，<b>直接用手槍射擊晶片進行裝備升級</b>！
    </div>
    <div class="gesture-guide">
      👉 <b>單指手槍</b>：食指伸直瞄準，精準單發狙擊<br>
      💥 <b>雙指霰彈</b>：食指＋中指併攏，扇形 5 發覆蓋<br>
      ⚡ <b>扣動拇指開火</b>：大拇指往下扣一下即射擊！<br>
      🎁 <b>射擊拾取晶片</b>：打爆浮動晶片即可啟動特異功能！
    </div>
    <button id="start-btn" class="action-btn">開啟相機 & BGM 開始戰鬥</button>
  </div>

  <!-- Game Over 結算視窗 -->
  <div id="game-over-modal" class="modal-overlay" style="display: none;">
    <div class="modal-title" style="background: linear-gradient(135deg, #ff0055, #ff5500); -webkit-background-clip: text;">SYSTEM CRITICAL</div>
    <div class="modal-desc">陣地失守！你遭到自爆無人機劇烈撞擊！</div>
    <div id="game-over-stats" class="game-over-stats">FINAL SCORE: 0</div>
    <button id="restart-btn" class="action-btn">滿血重新出擊</button>
  </div>
</div>

<script>
// ==========================================
// 1. Web Audio API：戰鬥音效、閃電電弧與賽博 BGM
// ==========================================
class SoundSynthesizer {
  constructor() {
    this.ctx = null;
    this.bgmPlaying = false;
    this.bgmTimer = null;
    this.step = 0;
    this.isBulletTime = false;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // 手槍射擊音
  playLaserPistol() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(this.isBulletTime ? 450 : 800, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + (this.isBulletTime ? 0.3 : 0.15));

    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + (this.isBulletTime ? 0.32 : 0.16));

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + (this.isBulletTime ? 0.32 : 0.16));

    this.playNoisePunch(0.08, 0.35);
  }

  // 霰彈槍射擊音
  playShotgun() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    for (let f of [320, 160]) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(this.isBulletTime ? f * 0.6 : f, now);
      osc.frequency.exponentialRampToValueAtTime(25, now + 0.3);

      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.32);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    }
    this.playNoisePunch(0.2, 0.7);
  }

  playNoisePunch(duration, volume) {
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1400, this.ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + duration);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start();
  }

  // ⚡ 連環閃電電弧滋滋音效
  playTeslaSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1600 + Math.random() * 800, now + i * 0.04);
      osc.frequency.exponentialRampToValueAtTime(200, now + i * 0.04 + 0.08);

      gain.gain.setValueAtTime(0.2, now + i * 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.08);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.04);
      osc.stop(now + i * 0.04 + 0.08);
    }
  }

  // 晶片裝備升級科技音效
  playUpgradeSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const freqs = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
    freqs.forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.06);

      gain.gain.setValueAtTime(0.35, now + i * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.18);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.06);
      osc.stop(now + i * 0.06 + 0.18);
    });
  }

  playHitSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.setValueAtTime(1900, now + 0.04);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }

  playExplosion() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * 0.35;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.08));
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(500, now);
    filter.frequency.exponentialRampToValueAtTime(60, now + 0.32);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.75, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }

  playHurtSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.25);
    gain.gain.setValueAtTime(0.65, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.28);
    this.playNoisePunch(0.18, 0.6);
  }

  playAlertBeep() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(950, now);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.06);
  }

  // 賽博 BGM (124 BPM)
  startBgm() {
    if (this.bgmPlaying || !this.ctx) return;
    this.bgmPlaying = true;
    this.step = 0;
    const stepInterval = (60 / 124) / 4;

    const bassNotes = [55, 55, 55, 55, 65.4, 65.4, 55, 55, 49, 49, 49, 49, 58.2, 58.2, 65.4, 65.4];
    const leadNotes = [220, 0, 261.6, 0, 293.6, 0, 329.6, 0, 392, 0, 329.6, 0, 293.6, 0, 261.6, 0];

    this.bgmTimer = setInterval(() => {
      if (!this.bgmPlaying || !this.ctx) return;
      const now = this.ctx.currentTime;
      const s = this.step % 16;
      const pitchMod = this.isBulletTime ? 0.65 : 1.0;

      // Kick
      if (s % 4 === 0) {
        const kickOsc = this.ctx.createOscillator();
        const kickGain = this.ctx.createGain();
        kickOsc.frequency.setValueAtTime(120 * pitchMod, now);
        kickOsc.frequency.exponentialRampToValueAtTime(35 * pitchMod, now + 0.08);
        kickGain.gain.setValueAtTime(0.22, now);
        kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        kickOsc.connect(kickGain);
        kickGain.connect(this.ctx.destination);
        kickOsc.start(now);
        kickOsc.stop(now + 0.09);
      }

      // Hi-hat
      if (s % 2 === 1) {
        const hhBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.03, this.ctx.sampleRate);
        const d = hhBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const hh = this.ctx.createBufferSource();
        hh.buffer = hhBuf;
        const hhFilter = this.ctx.createBiquadFilter();
        hhFilter.type = 'highpass';
        hhFilter.frequency.setValueAtTime(7000 * pitchMod, now);
        const hhGain = this.ctx.createGain();
        hhGain.gain.setValueAtTime(0.05, now);
        hhGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        hh.connect(hhFilter);
        hhFilter.connect(hhGain);
        hhGain.connect(this.ctx.destination);
        hh.start(now);
      }

      // Bass
      const bassFreq = bassNotes[s] * pitchMod;
      if (bassFreq > 0) {
        const bOsc = this.ctx.createOscillator();
        const bGain = this.ctx.createGain();
        bOsc.type = 'sawtooth';
        bOsc.frequency.setValueAtTime(bassFreq, now);
        const bFilter = this.ctx.createBiquadFilter();
        bFilter.type = 'lowpass';
        bFilter.frequency.setValueAtTime(300 * pitchMod, now);

        bGain.gain.setValueAtTime(0.07, now);
        bGain.gain.exponentialRampToValueAtTime(0.001, now + stepInterval * 1.5);

        bOsc.connect(bFilter);
        bFilter.connect(bGain);
        bGain.connect(this.ctx.destination);
        bOsc.start(now);
        bOsc.stop(now + stepInterval * 1.5);
      }

      // Lead
      const leadFreq = leadNotes[s] * pitchMod;
      if (leadFreq > 0) {
        const lOsc = this.ctx.createOscillator();
        const lGain = this.ctx.createGain();
        lOsc.type = 'sine';
        lOsc.frequency.setValueAtTime(leadFreq, now);
        lGain.gain.setValueAtTime(0.035, now);
        lGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        lOsc.connect(lGain);
        lGain.connect(this.ctx.destination);
        lOsc.start(now);
        lOsc.stop(now + 0.12);
      }

      this.step++;
    }, stepInterval * 1000);
  }

  stopBgm() {
    this.bgmPlaying = false;
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }

  toggleBgm() {
    if (this.bgmPlaying) {
      this.stopBgm();
      return false;
    } else {
      this.startBgm();
      return true;
    }
  }
}

class FloatingChip {
  constructor(def, x, y) {
    this.def = def;
    this.x = x;
    this.y = y;
    this.radius = 32;
    this.vy = 0.6; // 緩慢在空中懸浮漂浮
    this.angle = 0;
    this.alpha = 1;
    this.isDead = false;
  }

  update(dt) {
    this.y += this.vy;
    this.angle += 0.04;
    // 浮出螢幕下方時自毀
    if (this.y > canvas.height + 60) this.isDead = true;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // 外層旋轉全息六角環
    ctx.rotate(this.angle);
    ctx.strokeStyle = this.def.color;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = this.def.color;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI) / 3;
      const px = Math.cos(a) * this.radius;
      const py = Math.sin(a) * this.radius;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // 內層微光晶片卡
    ctx.rotate(-this.angle * 2);
    ctx.fillStyle = 'rgba(10, 20, 40, 0.75)';
    ctx.fillRect(-18, -18, 36, 36);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(-18, -18, 36, 36);

    // 核心圖示
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.def.name.slice(0, 2), 0, 0);

    // 懸浮標題指示
    ctx.font = '900 11px sans-serif';
    ctx.fillStyle = this.def.color;
    ctx.fillText(this.def.name, 0, -this.radius - 8);
    ctx.font = '800 9px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('SHOOT TO EQUIP', 0, this.radius + 12);

    ctx.restore();
  }
}

class NormalDrone {
  constructor() {
    this.type = 'NORMAL';
    this.radius = 32 + Math.random() * 12;
    this.x = Math.random() < 0.5 ? -40 : canvas.width + 40;
    this.y = 80 + Math.random() * (canvas.height * 0.45);
    this.targetX = canvas.width * 0.15 + Math.random() * (canvas.width * 0.7);
    this.targetY = canvas.height * 0.15 + Math.random() * (canvas.height * 0.4);
    this.hp = 1;
    this.angle = 0;
    this.hoverOffset = Math.random() * Math.PI * 2;
  }

  update(dt, timeScale) {
    this.x += (this.targetX - this.x) * (0.04 * timeScale);
    this.y += (this.targetY - this.y) * (0.04 * timeScale);
    this.angle += 0.03 * timeScale;
    return false;
  }

  draw(ctx) {
    const hoverY = this.y + Math.sin(Date.now() * 0.005 + this.hoverOffset) * 8;
    ctx.save();
    ctx.translate(this.x, hoverY);

    ctx.rotate(this.angle);
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.rotate(-this.angle * 2);
    ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '900 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DRONE', 0, -this.radius - 6);
    ctx.restore();
  }
}

class KamikazeDrone {
  constructor() {
    this.type = 'KAMIKAZE';
    this.radius = 28;
    this.x = canvas.width * 0.2 + Math.random() * (canvas.width * 0.6);
    this.y = -60;
    this.targetX = canvas.width * 0.5 + (Math.random() - 0.5) * 120;
    this.targetY = canvas.height * 0.55;
    this.speed = 2.8 + Math.random() * 2.0;
    this.hp = 2;
    this.angle = 0;
    this.beepTimer = 0;
    this.scale = 0.6;
  }

  update(dt, timeScale) {
    this.angle += 0.12 * timeScale;

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    this.x += (dx / dist) * this.speed * 2.2 * timeScale;
    this.y += (dy / dist) * this.speed * 2.2 * timeScale;
    this.speed += 0.05 * timeScale;
    this.scale = Math.min(2.4, this.scale + 0.015 * timeScale);

    this.beepTimer += dt * timeScale;
    if (this.beepTimer > 0.35) {
      this.beepTimer = 0;
      sfx.playAlertBeep();
    }

    if (dist < 35 || this.y > canvas.height * 0.65) {
      this.detonateOnPlayer();
      return true;
    }
    return false;
  }

  detonateOnPlayer() {
    if (hasNanoShield) {
      // 護盾抵擋！
      hasNanoShield = false;
      sfx.playExplosion();
      spawnExplosion(this.x, this.y, '#00f0ff');
      spawnFloatingText('🛡️ SHIELD BLOCKED!', canvas.width * 0.5, canvas.height * 0.5, '#00f0ff');
      // 移除護盾徽章
      const pills = perksInventory.querySelectorAll('.perk-pill');
      pills.forEach(p => { if (p.innerText.includes('護盾')) p.remove(); });
      return;
    }

    applyDamage(20);
    spawnExplosion(this.x, this.y, '#ff0033');
    sfx.playHurtSound();
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.scale, this.scale);

    ctx.rotate(this.angle);
    ctx.fillStyle = '#ff0033';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 18;

    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(-10, -10);
      ctx.lineTo(0, -this.radius - 8);
      ctx.lineTo(10, -10);
      ctx.closePath();
      ctx.fill();
    }

    const flash = Math.sin(Date.now() * 0.02) > 0 ? '#ffea00' : '#ff0000';
    ctx.fillStyle = flash;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffea00';
    ctx.font = '900 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚠️ KAMIKAZE', 0, -this.radius - 12);
    ctx.restore();
  }
}

  else if (pct < 60) hpBarFill.style.background = '#ffaa00';

function spawnExplosion(x, y, color = '#ff0055') {

    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed - 2,
      size: 4 + Math.random() * 6,
      color: color,
      alpha: 1,
      decay: 0.02 + Math.random() * 0.02,

    });

// ⚡ 閃電電弧連鎖 (Tesla Chain)
function triggerTeslaChain(originEnemy) {
  sfx.playTeslaSound();
  let chained = 0;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const target = enemies[i];
    if (target === originEnemy) continue;

    const d = Math.hypot(target.x - originEnemy.x, target.y - originEnemy.y);
    if (d < 300) {
      // 繪製閃電
      lightningBolts.push({
        x1: originEnemy.x, y1: originEnemy.y,
        x2: target.x, y2: target.y,
        alpha: 1
      });

      target.hp -= 2;
      if (target.hp <= 0) {
        sfx.playExplosion();
        spawnExplosion(target.x, target.y, '#00f0ff');
        enemies.splice(i, 1);
        score += 150 * combo;
        scoreElem.innerText = score;
        spawnFloatingText('⚡ TESLA KILL!', target.x, target.y, '#00f0ff');
      }

      chained++;
      if (chained >= 2) break; // 最多連鎖 2 隻
    }
  }
}

// ==========================================
// 5. 射擊系統 (支援肉鴿高爆穿透 & 射擊撿晶片)
// ==========================================
function executeFire(originX, originY, targetX, targetY) {
  const now = Date.now();
  const isShotgun = currentWeapon === 'SHOTGUN';
  const cooldown = isShotgun ? 320 : 180;

  if (now - lastFireTime < cooldown) return;
  lastFireTime = now;

  if (isShotgun) {
    sfx.playShotgun();
    screenShake = 18;
    flashOverlay.style.opacity = '1';
    setTimeout(() => { flashOverlay.style.opacity = '0'; }, 80);
    if (navigator.vibrate) navigator.vibrate([60]);
  } else {
    sfx.playLaserPistol();
    screenShake = 10;
    flashOverlay.style.opacity = '0.85';
    setTimeout(() => { flashOverlay.style.opacity = '0'; }, 50);
    if (navigator.vibrate) navigator.vibrate([30]);
  }

  // 1. 射擊拾取肉鴿晶片檢測 (Shoot-to-Equip)
  for (let i = floatingChips.length - 1; i >= 0; i--) {
    const chip = floatingChips[i];
    const dist = Math.hypot(targetX - chip.x, targetY - chip.y);
    if (dist < chip.radius + 25) {
      equipPerk(chip.def);
      spawnExplosion(chip.x, chip.y, chip.def.color);
      floatingChips.splice(i, 1);
      return; // 晶片吸附成功
    }
  }

  // 2. 構建射擊彈道
  const pellets = [];
  if (isShotgun) {
    const baseAngle = Math.atan2(targetY - originY, targetX - originX);
    const spreadAngles = [-0.22, -0.11, 0, 0.11, 0.22];
    const len = Math.hypot(targetX - originX, targetY - originY) || 300;

    for (let offset of spreadAngles) {
      const ang = baseAngle + offset;
      pellets.push({
        tx: originX + Math.cos(ang) * len,
        ty: originY + Math.sin(ang) * len,
        color: activePerks.clusterBomb ? '#ff3300' : '#ff9900'
      });
    }
  } else {
    pellets.push({
      tx: targetX,
      ty: targetY,
      color: activePerks.clusterBomb ? '#ff3300' : '#00f0ff'
    });
  }

  // 3. 繪製雷射與穿透判定
  for (let p of pellets) {
    laserBeams.push({
      x1: originX, y1: originY,
      x2: p.tx, y2: p.ty,
      color: p.color,
      alpha: 1
    });

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dist = Math.hypot(p.tx - e.x, p.ty - e.y);
      if (dist < e.radius + 24) {
        e.hp -= (activePerks.clusterBomb ? 2 : 1);
        sfx.playHitSound();

        // 💥 高爆穿透 AOE
        if (activePerks.clusterBomb) {
          spawnExplosion(p.tx, p.ty, '#ff5500');
        }

        if (e.hp <= 0) {
          sfx.playExplosion();
          spawnExplosion(e.x, e.y, e.type === 'KAMIKAZE' ? '#ff3300' : '#00ffff');

          // ⚡ 連環高壓電弧觸發
          if (activePerks.teslaChain) {
            triggerTeslaChain(e);
          }

          killCount++;
          if (now - lastHitTime < 2500) combo++;
          else combo = 1;
          lastHitTime = now;

          const basePoints = e.type === 'KAMIKAZE' ? 250 : 100;
          const points = basePoints * combo;
          score += points;
          scoreElem.innerText = score;

          if (combo > 1) {
            comboElem.innerText = `${combo}x`;
            comboElem.classList.add('active');
          }

          spawnFloatingText(`+${points}`, e.x, e.y, e.type === 'KAMIKAZE' ? '#ffaa00' : '#00ff88');
          enemies.splice(i, 1);

          // 🎁 每滿 7 殺掉落一次肉鴿晶片！
          if (killCount % 7 === 0) {
            spawnPerkDrop();
          }
        }

        if (!activePerks.clusterBomb) {
          break; // 若沒有穿透技能，子彈被消耗
        }
      }
    }
  }
}

// 點擊螢幕備用開火

// ==========================================
// 6. MediaPipe 手勢辨識
// ==========================================
function onResults(results) {
  if (isGameOver) return;

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    isGunDetected = false;
    gunCrosshair.active = false;
    currentHandLandmarks = null;
    statusDot.className = 'status-dot';
    statusText.innerText = '尋找手部中... 請將手伸入鏡頭 👉';
    return;
  }

  const landmarks = results.multiHandLandmarks[0];
  const pts = landmarks.map(p => ({
    x: (currentFacingMode === 'user' ? (1 - p.x) : p.x) * canvas.width,
    y: p.y * canvas.height,
    z: p.z
  }));
  currentHandLandmarks = pts;

  const dist = (i, j) => Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
  const palmSize = dist(0, 5) || 100;
  if (palmSize < 25) return;

  const isIndexStraight = dist(8, 5) > dist(6, 5) * 1.5;
  const isMiddleStraight = dist(12, 9) > dist(10, 9) * 1.45 && dist(12, 0) > dist(8, 0) * 0.8;

  if (isIndexStraight && isMiddleStraight) {
    currentWeapon = 'SHOTGUN';
  } else if (isIndexStraight) {
    currentWeapon = 'PISTOL';
  }

  const isGunPose = isIndexStraight;

  if (isGunPose) {
    isGunDetected = true;
    gunCrosshair.active = true;

    muzzlePos = { x: pts[8].x, y: pts[8].y };

    const dirX = pts[8].x - pts[6].x;
    const dirY = pts[8].y - pts[6].y;
    const dirLen = Math.hypot(dirX, dirY) || 1;

    gunCrosshair.targetX = pts[8].x + (dirX / dirLen) * 140;
    gunCrosshair.targetY = pts[8].y + (dirY / dirLen) * 140;

    const thumbDist = dist(4, 5) / palmSize;
    const thumbSpeed = prevThumbDist - thumbDist;
    prevThumbDist = thumbDist;

    const now = Date.now();

    if (thumbDist > 0.45) {
      isThumbReady = true;
      statusDot.className = 'status-dot ready';
      statusText.innerText = currentWeapon === 'SHOTGUN' 
        ? '💥 霰彈就緒！扣動拇指 5 連發覆蓋！' 
        : '🎯 鎖定瞄準！向下扣動大拇指開火！';
    } else if (isThumbReady && (thumbDist < 0.38 || thumbSpeed > 0.08)) {
      isThumbReady = false;
      statusDot.className = 'status-dot';
      statusText.innerText = '💥 FIRE!! 開火！';
      executeFire(muzzlePos.x, muzzlePos.y, gunCrosshair.x, gunCrosshair.y);
    }
  } else {
    isGunDetected = false;
    gunCrosshair.active = false;
    statusDot.className = 'status-dot';
    statusText.innerText = '請比出手指槍：單指 👉 手槍 / 雙指 ✌️ 霰彈';
  }
}

// ==========================================
// 7. 主遊戲循環 (繪圖、物理與子彈時間)
// ==========================================
let lastTime = performance.now();
function gameLoop() {
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // ⏱️ 子彈時間倒數計算
  let timeScale = 1.0;
  if (activePerks.bulletTimeTimer > 0) {
    activePerks.bulletTimeTimer -= dt;
    timeScale = 0.28; // 速度降低 72%
    if (activePerks.bulletTimeTimer <= 0) {
      bulletTimeOverlay.style.opacity = '0';
      sfx.isBulletTime = false;
    }
  }

  if (!isGameOver) {
    if (combo > 0 && Date.now() - lastHitTime > 3000) {
      combo = 0;
      comboElem.classList.remove('active');
    }

    if (enemies.length < 4 && Date.now() > nextSpawnTime) {
      if (Math.random() < 0.35) {
        enemies.push(new KamikazeDrone());
      } else {
        enemies.push(new NormalDrone());
      }
      nextSpawnTime = Date.now() + 1600 + Math.random() * 1200;
    }

    // 更新敵人
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const shouldRemove = e.update(dt, timeScale);
      if (shouldRemove) enemies.splice(i, 1);
    }

    // 更新浮動肉鴿晶片
    for (let i = floatingChips.length - 1; i >= 0; i--) {
      const chip = floatingChips[i];
      chip.update(dt);
      if (chip.isDead) floatingChips.splice(i, 1);
    }
  }

  // 螢幕震動
  ctx.save();
  if (screenShake > 0) {
    const rx = (Math.random() - 0.5) * screenShake;
    const ry = (Math.random() - 0.5) * screenShake;
    ctx.translate(rx, ry);
    screenShake *= 0.85;
    if (screenShake < 0.5) screenShake = 0;
  }

  // 1. 繪製相機畫面
  if (videoElement.readyState >= 2) {
    ctx.save();
    if (currentFacingMode === 'user') {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    // 輕量暗角
    const vignette = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, canvas.width * 0.35,
      canvas.width / 2, canvas.height / 2, canvas.width * 0.75
    );
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(5, 10, 25, 0.5)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#0a0d1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 2. 繪製浮動肉鴿晶片箱
  for (let chip of floatingChips) {
    chip.draw(ctx);
  }

  // 3. 繪製所有敵人
  for (let e of enemies) {
    e.draw(ctx);
  }

  // 4. 繪製閃電電弧
  for (let i = lightningBolts.length - 1; i >= 0; i--) {
    const bolt = lightningBolts[i];
    ctx.save();
    ctx.strokeStyle = `rgba(0, 240, 255, ${bolt.alpha})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(bolt.x1, bolt.y1);
    // 鋸齒折線
    const midX = (bolt.x1 + bolt.x2) / 2 + (Math.random() - 0.5) * 35;
    const midY = (bolt.y1 + bolt.y2) / 2 + (Math.random() - 0.5) * 35;
    ctx.lineTo(midX, midY);
    ctx.lineTo(bolt.x2, bolt.y2);
    ctx.stroke();
    ctx.restore();

    bolt.alpha -= 0.15;
    if (bolt.alpha <= 0) lightningBolts.splice(i, 1);
  }

  // 5. 繪製雷射光束
  for (let i = laserBeams.length - 1; i >= 0; i--) {
    const beam = laserBeams[i];
    ctx.save();
    ctx.strokeStyle = beam.color || '#00f0ff';
    ctx.lineWidth = currentWeapon === 'SHOTGUN' ? 6 : 4;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(beam.x1, beam.y1);
    ctx.lineTo(beam.x2, beam.y2);
    ctx.stroke();
    ctx.restore();

    beam.alpha -= 0.12;
    if (beam.alpha <= 0) laserBeams.splice(i, 1);
  }

  // 6. 繪製粒子碎片
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * timeScale;
    p.y += p.vy * timeScale;
    p.vy += p.gravity * timeScale;
    p.alpha -= p.decay * timeScale;

    ctx.save();
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (p.alpha <= 0) particles.splice(i, 1);
  }

  // 7. 繪製浮動文字
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy * timeScale;
    ft.alpha -= 0.025 * timeScale;

    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.fillStyle = ft.color;
    ctx.font = '900 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = ft.color;
    ctx.shadowBlur = 10;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();

    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }

  // 8. 繪製霓虹手部骨架
  if (currentHandLandmarks) {
    const pts = currentHandLandmarks;
    ctx.save();
    ctx.strokeStyle = currentWeapon === 'SHOTGUN' ? 'rgba(255, 120, 0, 0.45)' : 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 2;
    const connections = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]
    ];
    for (const [a, b] of connections) {
      ctx.beginPath();
      ctx.moveTo(pts[a].x, pts[a].y);
      ctx.lineTo(pts[b].x, pts[b].y);
      ctx.stroke();
    }

    ctx.fillStyle = currentWeapon === 'SHOTGUN' ? '#ffaa00' : '#00f0ff';
    ctx.beginPath();
    ctx.arc(pts[8].x, pts[8].y, 6, 0, Math.PI * 2);
    if (currentWeapon === 'SHOTGUN') ctx.arc(pts[12].x, pts[12].y, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = isThumbReady ? '#00ff88' : '#ff4444';
    ctx.beginPath();
    ctx.arc(pts[4].x, pts[4].y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 9. 繪製準星 (帶武器微標籤，釋放頂部視野)
  if (gunCrosshair.active) {
    if (gunCrosshair.x === -100) {
      gunCrosshair.x = gunCrosshair.targetX;
      gunCrosshair.y = gunCrosshair.targetY;
    } else {
      gunCrosshair.x += (gunCrosshair.targetX - gunCrosshair.x) * 0.45;
      gunCrosshair.y += (gunCrosshair.targetY - gunCrosshair.y) * 0.45;
    }

    const cx = gunCrosshair.x;
    const cy = gunCrosshair.y;
    ctx.save();
    ctx.translate(cx, cy);

    const themeColor = currentWeapon === 'SHOTGUN' 
      ? (isThumbReady ? '#ffaa00' : '#ff5500') 
      : (isThumbReady ? '#00ff88' : '#00f0ff');

    ctx.strokeStyle = themeColor;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = themeColor;
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.arc(0, 0, currentWeapon === 'SHOTGUN' ? 32 : 24, 0, Math.PI * 2);
    ctx.stroke();

    if (currentWeapon === 'SHOTGUN') {
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = themeColor;
        ctx.beginPath();
        ctx.arc(0, 32, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.beginPath();
    ctx.moveTo(-35, 0); ctx.lineTo(-14, 0);
    ctx.moveTo(14, 0); ctx.lineTo(35, 0);
    ctx.moveTo(0, -35); ctx.lineTo(0, -14);
    ctx.moveTo(0, 14); ctx.lineTo(0, 35);
    ctx.stroke();

    // 準星下方微型武器與狀態標籤
    ctx.shadowBlur = 0;
    ctx.fillStyle = themeColor;
    ctx.font = '900 11px sans-serif';
    ctx.textAlign = 'center';
    const weaponLabel = currentWeapon === 'SHOTGUN' ? '💥 SHOTGUN' : '🔫 PISTOL';
    const statusLabel = isThumbReady ? 'READY' : 'AIM';
    ctx.fillText(`${weaponLabel} · ${statusLabel}`, 0, currentWeapon === 'SHOTGUN' ? 48 : 38);

    ctx.restore();
  }

  ctx.restore();

  requestAnimationFrame(gameLoop);
}

// ==========================================
// 8. 初始化 MediaPipe Hands & 攝影機控制
// ==========================================
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 0,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
hands.onResults(onResults);

function startCamera(facingMode = 'environment') {
  currentFacingMode = facingMode;
  if (cameraInstance) {
    cameraInstance.stop();
  }

  cameraInstance = new Camera(videoElement, {
    onFrame: async () => {
      await hands.send({ image: videoElement });
    },
    width: { ideal: 640 },
    height: { ideal: 480 },
    facingMode: facingMode
  });
  cameraInstance.start();
}

// 事件監聽
document.getElementById('camera-flip-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  startCamera(currentFacingMode);
});

bgmToggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOn = sfx.toggleBgm();
  bgmToggleBtn.innerText = isOn ? '🎵' : '🔇';
});

document.getElementById('start-btn').addEventListener('click', () => {
  sfx.init();
  sfx.startBgm();
  document.getElementById('start-modal').style.display = 'none';
  startCamera(currentFacingMode);
  requestAnimationFrame(gameLoop);
});

document.getElementById('restart-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  restartGame();
});
</script>
